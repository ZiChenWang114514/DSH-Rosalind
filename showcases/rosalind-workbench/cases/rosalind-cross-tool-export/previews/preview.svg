<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Rosalind evidence RO-Crate</title><desc id="desc">Four case-specific evidence groups feed a deterministic RO-Crate package while preserving each artifact's evidence class.</desc>
<rect width="1200" height="675" fill="#071522"/><style>.k{font:600 21px Segoe UI,Arial;fill:#67e8f9}.t{font:700 42px Segoe UI,Arial;fill:#f8fafc}.h{font:700 22px Segoe UI,Arial;fill:#f8fafc}.b{font:21px Segoe UI,Arial;fill:#cbd5e1}.s{font:16px Segoe UI,Arial;fill:#94a3b8}</style>
<text x="64" y="68" class="k">RO-CRATE 1.1 · DETERMINISTIC EXPORT</text><text x="64" y="125" class="t">Evidence stays identifiable in transit</text><rect x="70" y="210" width="330" height="70" rx="16" fill="#0f2538" stroke="#22d3ee"/><text x="95" y="241" class="h">GB1</text><text x="95" y="266" class="s">computed result</text><path d="M400 245 H650" stroke="#22d3ee" stroke-width="4"/><rect x="70" y="305" width="330" height="70" rx="16" fill="#0f2538" stroke="#fbbf24"/><text x="95" y="336" class="h">PD-L1 assays</text><text x="95" y="361" class="s">experimental plan</text><path d="M400 340 H650" stroke="#fbbf24" stroke-width="4"/><rect x="70" y="400" width="330" height="70" rx="16" fill="#0f2538" stroke="#a78bfa"/><text x="95" y="431" class="h">Boltz-2</text><text x="95" y="456" class="s">prediction evidence</text><path d="M400 435 H650" stroke="#a78bfa" stroke-width="4"/><rect x="70" y="495" width="330" height="70" rx="16" fill="#0f2538" stroke="#2dd4bf"/><text x="95" y="526" class="h">Workflows</text><text x="95" y="551" class="s">direct QC + plans</text><path d="M400 530 H650" stroke="#2dd4bf" stroke-width="4"/>
<rect x="650" y="240" width="460" height="300" rx="28" fill="#102a3f" stroke="#67e8f9" stroke-width="3"/><text x="710" y="310" class="h">Rosalind evidence package</text><text x="710" y="365" class="b">16 selected artifacts</text><text x="710" y="410" class="b">metadata + inventory + validation</text><text x="710" y="455" class="b">fixed-timestamp ZIP</text><text x="710" y="505" class="s">plans remain plans · predictions remain predictions</text>
<text x="64" y="635" class="s">Packaging improves inspection and transfer; it does not increase scientific evidence strength.</text>
</svg>
