<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Kinase inhibitor metabolism-evidence review</title><desc id="desc">Comparison of public label evidence and local structural review prompts for three kinase inhibitors.</desc><style>.title{font:700 38px Segoe UI,Arial;fill:#f8fafc}.sub{font:19px Segoe UI,Arial;fill:#a9bdd0}.head{font:600 17px Segoe UI,Arial;fill:#67e8f9}.name{font:600 21px Segoe UI,Arial;fill:#f8fafc}.num{font:20px Consolas,monospace;fill:#dbeafe}.evidence{font:18px Segoe UI,Arial;fill:#99f6e4}.foot{font:16px Segoe UI,Arial;fill:#fbbf24}</style><rect width="1200" height="675" fill="#071726"/><rect x="48" y="48" width="1104" height="580" rx="28" fill="#0b2237" stroke="#164e63"/><text x="80" y="108" class="title">Kinase inhibitor metabolism review</text><text x="82" y="150" class="sub">Official label evidence joined to transparent structure queries</text><line x1="80" y1="205" x2="1118" y2="205" stroke="#155e75"/><text x="88" y="260" class="head">Compound</text><text x="430" y="260" class="head">RDKit LogP</text><text x="620" y="260" class="head">Matched query types</text><text x="790" y="260" class="head">Evidence retained</text><text x="88" y="320" class="name">Imatinib</text><text x="430" y="320" class="num">4.59</text><text x="620" y="320" class="num">2</text><text x="790" y="320" class="evidence">DailyMed + PubChem</text><text x="88" y="404" class="name">Gefitinib</text><text x="430" y="404" class="num">4.28</text><text x="620" y="404" class="num">2</text><text x="790" y="404" class="evidence">DailyMed + PubChem</text><text x="88" y="488" class="name">Erlotinib</text><text x="430" y="488" class="num">3.41</text><text x="620" y="488" class="num">2</text><text x="790" y="488" class="evidence">DailyMed + PubChem</text><text x="82" y="590" class="foot">A SMARTS hit is a review prompt; it is not a metabolism or clearance prediction.</text></svg>
