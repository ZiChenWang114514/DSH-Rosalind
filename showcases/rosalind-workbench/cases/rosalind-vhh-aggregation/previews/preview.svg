<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">VHH sequence aggregation-risk screen</title><desc id="desc">Sequence-only comparison of three public VHH polymer records.</desc>
<style>.title{font:700 39px Segoe UI,Arial;fill:#f8fafc}.sub{font:19px Segoe UI,Arial;fill:#a9bdd0}.head{font:600 17px Segoe UI,Arial;fill:#67e8f9}.name{font:600 20px Segoe UI,Arial;fill:#f8fafc}.num{font:19px Consolas,monospace;fill:#dbeafe}.foot{font:16px Segoe UI,Arial;fill:#fbbf24}</style><rect width="1200" height="675" fill="#071726"/><rect x="48" y="48" width="1104" height="580" rx="28" fill="#0b2237" stroke="#164e63"/><text x="80" y="108" class="title">VHH sequence risk proxies</text><text x="82" y="150" class="sub">Exact PDB polymer sequences · tags excluded at terminal VTVSS</text><line x1="80" y1="205" x2="1118" y2="205" stroke="#155e75"/><text x="82" y="250" class="head">VHH</text><text x="465" y="250" class="head">pI</text><text x="610" y="250" class="head">Charge pH 7.4</text><text x="785" y="250" class="head">Hydrophobic 9-mer</text><text x="970" y="250" class="head">|Charge| 9-mer</text><text x="82" y="310" class="name">nb8 anti-TssK</text><text x="465" y="310" class="num">8.76</text><text x="610" y="310" class="num">2.25</text><text x="785" y="310" class="num">7/9</text><text x="970" y="310" class="num">3</text><text x="82" y="392" class="name">SARS VHH-72</text><text x="465" y="392" class="num">4.69</text><text x="610" y="392" class="num">-2.74</text><text x="785" y="392" class="num">7/9</text><text x="970" y="392" class="num">4</text><text x="82" y="474" class="name">EGFR VHH 7D12</text><text x="465" y="474" class="num">7.60</text><text x="610" y="474" class="num">0.26</text><text x="785" y="474" class="num">8/9</text><text x="970" y="474" class="num">3</text><text x="82" y="590" class="foot">Sequence flags nominate experiments; they do not measure aggregation or solvent exposure.</text></svg>
