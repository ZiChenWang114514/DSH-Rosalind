<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Breast-cancer Visium collection metadata QC</title><desc id="desc">Fifteen Visium datasets grouped into carcinoma and normal breast metadata summaries.</desc>
<rect width="1200" height="675" fill="#081521"/><text x="62" y="76" fill="#6de1cf" font-family="Segoe UI,Arial" font-size="23">CELLxGENE DISCOVER · VISIUM V1 · METADATA QC</text><text x="62" y="132" fill="#f4f8fb" font-family="Segoe UI,Arial" font-size="42" font-weight="700">Breast spatial collection</text><text x="62" y="171" fill="#a7bdcd" font-family="Segoe UI,Arial" font-size="21">15 datasets · 74,880 capture spots · 35,477 features each</text>
<g transform="translate(62 214)"><rect width="1076" height="306" rx="24" fill="#0d2638" stroke="#244a63"/>
