<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Trastuzumab CDR interface map</title><desc id="desc">Direct HER2 contacts in PDB 1N8Z across six operational CDR ranges.</desc><rect width="1200" height="675" fill="#071522"/><circle cx="1080" cy="70" r="220" fill="#0e7490" opacity=".25"/><style>.k{font:600 22px Segoe UI,Arial;fill:#67e8f9}.t{font:700 43px Segoe UI,Arial;fill:#f8fafc}.b{font:24px Segoe UI,Arial;fill:#cbd5e1}.m{font:700 39px Segoe UI,Arial;fill:#f8fafc}.s{font:18px Segoe UI,Arial;fill:#cbd5e1}.n{font:700 20px Segoe UI,Arial;fill:#f8fafc}</style><text x="70" y="85" class="k">PUBLIC PDB 1N8Z · 2.52 Å X-RAY STRUCTURE</text><text x="70" y="150" class="t">Trastuzumab CDR–HER2 interface</text><rect x="70" y="215" width="360" height="320" rx="20" fill="#0f2538" stroke="#155e75"/><text x="105" y="275" class="b">CDR residues analyzed</text><text x="105" y="325" class="m">56</text><text x="105" y="400" class="b">Within 4.5 Å of HER2</text><text x="105" y="450" class="m">17</text><text x="500" y="245" class="b">Direct-contact residues by operational CDR</text><rect x="510" y="340" width="58" height="160" rx="7" fill="#38bdf8"/><text x="539" y="535" text-anchor="middle" class="s">L1</text><text x="539" y="320" text-anchor="middle" class="n">4</text><rect x="610" y="420" width="58" height="80" rx="7" fill="#2dd4bf"/><text x="639" y="535" text-anchor="middle" class="s">L2</text><text x="639" y="400" text-anchor="middle" class="n">2</text><rect x="710" y="340" width="58" height="160" rx="7" fill="#a78bfa"/><text x="739" y="535" text-anchor="middle" class="s">L3</text><text x="739" y="320" text-anchor="middle" class="n">4</text><rect x="810" y="460" width="58" height="40" rx="7" fill="#fbbf24"/><text x="839" y="535" text-anchor="middle" class="s">H1</text><text x="839" y="440" text-anchor="middle" class="n">1</text><rect x="910" y="300" width="58" height="200" rx="7" fill="#fb7185"/><text x="939" y="535" text-anchor="middle" class="s">H2</text><text x="939" y="280" text-anchor="middle" class="n">5</text><rect x="1010" y="460" width="58" height="40" rx="7" fill="#22d3ee"/><text x="1039" y="535" text-anchor="middle" class="s">H3</text><text x="1039" y="440" text-anchor="middle" class="n">1</text><text x="70" y="620" class="s">Non-contact conservative proposals are testable hypotheses, not validated affinity improvements.</text></svg>