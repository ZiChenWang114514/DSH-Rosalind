  <text x="60" y="606" fill="#8eb8b2" font-family="Segoe UI,Arial" font-size="16">Sampled CORE→LID centroid: 21.525 → 31.140 Å maximum among retained frames</text>
  <text x="60" y="637" fill="#6f9795" font-family="Segoe UI,Arial" font-size="14">Five selected frames support inspection; they do not estimate kinetics or equilibrium populations.</text>
