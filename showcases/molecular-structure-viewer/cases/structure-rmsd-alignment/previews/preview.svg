<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Adenylate kinase open and closed conformation alignment</title>
  <desc id="desc">Calculated chain-A C-alpha alignment summary for RCSB 4AKE and 1AKE.</desc>
  <rect width="1200" height="675" rx="28" fill="#0b1220"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="34" font-weight="700">Adenylate kinase · 4AKE ↔ 1AKE</text>
  <text x="64" y="106" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="18">214 exact chain-A Cα pairs · unweighted Kabsch fit</text>
  <g transform="translate(70 150)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 210 C35 120 95 45 180 98 C235 132 246 205 190 250 C140 292 96 263 80 210Z" stroke="#22d3ee" stroke-width="24" opacity=".88"/>
    <path d="M192 250 C260 190 312 138 386 82" stroke="#22d3ee" stroke-width="24" opacity=".88"/>
    <path d="M94 222 C68 130 144 86 213 140 C258 174 250 233 203 270 C164 300 112 278 94 222Z" stroke="#f472b6" stroke-width="18" opacity=".82"/>
    <path d="M206 270 C248 258 302 244 385 210" stroke="#f472b6" stroke-width="18" opacity=".82"/>
    <circle cx="386" cy="82" r="10" fill="#22d3ee" stroke="none"/><circle cx="385" cy="210" r="10" fill="#f472b6" stroke="none"/>
    <text x="32" y="340" fill="#67e8f9" stroke="none" font-family="Segoe UI,Arial" font-size="17">4AKE open</text>
    <text x="278" y="340" fill="#f9a8d4" stroke="none" font-family="Segoe UI,Arial" font-size="17">1AKE AP5-bound</text>
  </g>
  <g font-family="Segoe UI,Arial">
    <rect x="560" y="150" width="570" height="92" rx="18" fill="#172033" stroke="#5eead4"/>
    <text x="590" y="182" fill="#99f6e4" font-size="15">WHOLE-CHAIN Cα RMSD</text><text x="590" y="222" fill="#fff" font-size="34" font-weight="700">7.130700 Å</text>
    <rect x="560" y="264" width="176" height="160" rx="18" fill="#172033"/>
    <text x="584" y="298" fill="#cbd5e1" font-size="15">CORE</text><text x="584" y="342" fill="#fff" font-size="27" font-weight="700">3.727 Å</text><text x="584" y="378" fill="#94a3b8" font-size="14">global fit</text><text x="584" y="402" fill="#5eead4" font-size="16">local 1.551 Å</text>
    <rect x="757" y="264" width="176" height="160" rx="18" fill="#172033"/>
    <text x="781" y="298" fill="#cbd5e1" font-size="15">NMP</text><text x="781" y="342" fill="#fff" font-size="27" font-weight="700">9.738 Å</text><text x="781" y="378" fill="#94a3b8" font-size="14">global fit</text><text x="781" y="402" fill="#5eead4" font-size="16">local 1.596 Å</text>
    <rect x="954" y="264" width="176" height="160" rx="18" fill="#172033"/>
    <text x="978" y="298" fill="#cbd5e1" font-size="15">LID</text><text x="978" y="342" fill="#fff" font-size="27" font-weight="700">11.238 Å</text><text x="978" y="378" fill="#94a3b8" font-size="14">global fit</text><text x="978" y="402" fill="#5eead4" font-size="16">local 0.602 Å</text>
    <rect x="560" y="447" width="570" height="104" rx="18" fill="#111827" stroke="#475569"/>
    <text x="590" y="482" fill="#cbd5e1" font-size="16">Largest retained Cα displacement</text><text x="590" y="528" fill="#f9a8d4" font-size="29" font-weight="700">Thr149 · 18.336170 Å</text>
    <text x="64" y="632" fill="#94a3b8" font-size="15">Calculated from retained RCSB PDB coordinates · local RMSD = independent domain fit · coordinate comparison only</text>
