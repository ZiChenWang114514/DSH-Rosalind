<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Exact lysozyme residue distance</title><desc id="desc">Closest-heavy-atom distance between GLU A 35 and ASP A 52 in RCSB 1LYZ.</desc>
<rect width="1200" height="675" fill="#071726"/><text x="70" y="80" fill="#67e8f9" font-family="Segoe UI,Arial" font-size="27">RCSB 1LYZ · model 1 · author numbering</text>
<text x="70" y="170" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="48" font-weight="700">Exact residue selection</text>
<rect x="70" y="235" width="420" height="170" rx="24" fill="#0f766e"/><rect x="710" y="235" width="420" height="170" rx="24" fill="#1d4ed8"/>
<text x="280" y="305" text-anchor="middle" fill="#ecfeff" font-family="Consolas,monospace" font-size="34">GLU A:35</text><text x="280" y="355" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI,Arial" font-size="22">9 heavy atoms</text>
<text x="920" y="305" text-anchor="middle" fill="#eff6ff" font-family="Consolas,monospace" font-size="34">ASP A:52</text><text x="920" y="355" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI,Arial" font-size="22">8 heavy atoms</text>
<line x1="490" y1="320" x2="710" y2="320" stroke="#fbbf24" stroke-width="5" stroke-dasharray="12 10"/><text x="600" y="295" text-anchor="middle" fill="#fde68a" font-family="Segoe UI,Arial" font-size="25">5.951 Å</text>
<text x="600" y="470" text-anchor="middle" fill="#e2e8f0" font-family="Consolas,monospace" font-size="23">OE1 (serial 276) ↔ OD2 (serial 405)</text>
<text x="70" y="585" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="22">Minimum Euclidean distance across 72 heavy-atom pairs; no bond or energy is inferred.</text>
</svg>
