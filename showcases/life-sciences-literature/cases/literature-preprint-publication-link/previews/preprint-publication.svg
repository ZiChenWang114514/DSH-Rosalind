<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Preprint to publication linkage</title>
  <desc id="desc">A timeline from two medRxiv versions to a linked Nature Communications paper.</desc>
  <rect width="1200" height="720" rx="28" fill="#111a2c"/>
  <text x="70" y="82" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">Preprint → publication</text>
  <text x="70" y="122" fill="#aebbd9" font-family="Inter,Segoe UI,sans-serif" font-size="20">One linked record pair, identifiers kept distinct</text>
  <line x1="160" y1="360" x2="1040" y2="360" stroke="#51627f" stroke-width="6"/>
  <circle cx="210" cy="360" r="24" fill="#ffb65c"/><circle cx="435" cy="360" r="24" fill="#ffb65c"/><circle cx="960" cy="360" r="30" fill="#6ed5c0"/>
  <text x="164" y="315" fill="#ffc985" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">medRxiv v1</text>
  <text x="154" y="407" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="19">10 Sep 2020</text>
  <text x="389" y="315" fill="#ffc985" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">medRxiv v2</text>
  <text x="379" y="407" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="19">11 Sep 2020</text>
  <text x="856" y="305" fill="#8be8d6" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Nature Communications</text>
  <text x="902" y="413" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="19">19 Feb 2021</text>
  <rect x="70" y="170" width="520" height="110" rx="18" fill="#272641" stroke="#ffb65c"/>
  <text x="95" y="210" fill="#ffcf92" font-family="Inter,Segoe UI,sans-serif" font-size="15">PREPRINT TITLE</text>
  <text x="95" y="247" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="23" font-weight="700">Evolution of immunity to SARS-CoV-2</text>
  <rect x="610" y="170" width="520" height="110" rx="18" fill="#17353b" stroke="#6ed5c0"/>
  <text x="635" y="210" fill="#8be8d6" font-family="Inter,Segoe UI,sans-serif" font-size="15">PUBLISHED TITLE</text>
  <text x="635" y="244" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Evolution of immune responses to SARS-CoV-2</text>
  <text x="635" y="268" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">in mild-moderate COVID-19</text>
  <rect x="365" y="480" width="470" height="120" rx="22" fill="#1e2b45" stroke="#667da8"/>
  <text x="600" y="525" text-anchor="middle" fill="#aebfe3" font-family="Inter,Segoe UI,sans-serif" font-size="17">COMPUTED INTERVAL</text>
  <text x="600" y="572" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">162 days</text>
  <text x="70" y="666" fill="#95a5c6" font-family="Inter,Segoe UI,sans-serif" font-size="15">Linked by the bioRxiv/medRxiv API; publication identity independently checked in PubMed.</text>
</svg>
