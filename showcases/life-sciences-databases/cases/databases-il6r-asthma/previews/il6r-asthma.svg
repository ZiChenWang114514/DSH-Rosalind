<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">IL6R and asthma evidence map</title><desc id="desc">Three connected evidence modules from Open Targets, GWAS Catalog, and GTEx.</desc>
  <rect width="1200" height="720" rx="28" fill="#071727"/>
  <text x="70" y="80" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">IL6R ↔ asthma</text>
  <text x="70" y="118" fill="#9eb8d4" font-family="Inter,Segoe UI,sans-serif" font-size="20">A three-source evidence map · 29 Aug 2026</text>
  <line x1="250" y1="320" x2="950" y2="320" stroke="#385a76" stroke-width="6"/>
  <circle cx="600" cy="320" r="90" fill="#0e6070" stroke="#61dfd4" stroke-width="4"/>
  <text x="600" y="310" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">IL6R</text>
  <text x="600" y="344" text-anchor="middle" fill="#baf4ef" font-family="Inter,Segoe UI,sans-serif" font-size="15">ENSG00000160712</text>
  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="70" y="190" width="360" height="270" rx="22" fill="#12283d" stroke="#6a91ff"/>
    <text x="100" y="232" fill="#a8beff" font-size="17">OPEN TARGETS</text>
    <text x="100" y="278" fill="#fff" font-size="25" font-weight="700">Asthma row found</text>
    <text x="100" y="321" fill="#d8e2f8" font-size="18">GWAS credible sets</text><rect x="100" y="338" width="275" height="15" rx="7" fill="#314867"/><rect x="100" y="338" width="243" height="15" rx="7" fill="#6a91ff"/>
    <text x="100" y="390" fill="#d8e2f8" font-size="18">Europe PMC</text><rect x="100" y="406" width="275" height="15" rx="7" fill="#314867"/><rect x="100" y="406" width="183" height="15" rx="7" fill="#9b7cff"/>
    <rect x="770" y="190" width="360" height="270" rx="22" fill="#12283d" stroke="#ffbd6a"/>
    <text x="800" y="232" fill="#ffd49d" font-size="17">GWAS CATALOG</text>
    <text x="800" y="282" fill="#fff" font-size="54" font-weight="700">10</text>
    <text x="800" y="319" fill="#e5d7c4" font-size="18">IL6R-mapped records returned</text>
    <text x="800" y="365" fill="#aebdd0" font-size="16">Trait labels were not exposed</text>
    <text x="800" y="391" fill="#aebdd0" font-size="16">in the compact response.</text>
    <rect x="340" y="500" width="520" height="145" rx="22" fill="#123933" stroke="#61df9d"/>
    <text x="370" y="540" fill="#9af2c5" font-size="17">GTEx v10 · rs2228145</text>
    <text x="370" y="585" fill="#fff" font-size="28" font-weight="700">7 IL6R eQTL tissues</text>
    <text x="370" y="617" fill="#cce9df" font-size="17">All returned IL6R NES values were negative</text>
  </g>
  <text x="70" y="685" fill="#879db5" font-family="Inter,Segoe UI,sans-serif" font-size="15">The modules provide complementary context; their combination alone does not prove causality or therapeutic direction.</text>
</svg>
