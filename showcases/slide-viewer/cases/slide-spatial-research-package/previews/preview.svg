<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Spatial research package inventory</title>
  <desc id="desc">Ten hash-pinned artifacts connect a licensed H5AD source to matrix summaries, a complete observation table, demonstration geometry, and scientific-layer mapping.</desc>
  <rect width="1200" height="675" fill="#f7f3ea"/>
  <text x="65" y="84" fill="#26384a" font-family="Segoe UI,Arial" font-size="40" font-weight="700">Spatial research package</text>
  <text x="65" y="127" fill="#647484" font-family="Segoe UI,Arial" font-size="22">10 repository paths · byte counts and SHA-256 verified</text>
  <g font-family="Segoe UI,Arial">
    <rect x="65" y="190" width="230" height="240" rx="18" fill="#dbeafe"/><rect x="345" y="190" width="230" height="240" rx="18" fill="#dcfce7"/><rect x="625" y="190" width="230" height="240" rx="18" fill="#fef3c7"/><rect x="905" y="190" width="230" height="240" rx="18" fill="#fce7f3"/>
    <text x="125" y="255" fill="#1e3a5f" font-size="25" font-weight="700">Source</text><text x="112" y="310" fill="#365673" font-size="22">H5AD + pins</text><text x="111" y="354" fill="#365673" font-size="22">684 × 18,078</text>
    <text x="402" y="255" fill="#245b3a" font-size="25" font-weight="700">Observations</text><text x="405" y="310" fill="#416d50" font-size="22">684-row CSV</text><text x="404" y="354" fill="#416d50" font-size="22">2 indexed genes</text>
    <text x="680" y="255" fill="#6c5015" font-size="25" font-weight="700">Geometry</text><text x="682" y="310" fill="#7a641f" font-size="22">3 polygons</text><text x="661" y="354" fill="#7a641f" font-size="22">demo annotation</text>
    <text x="964" y="255" fill="#71345a" font-size="25" font-weight="700">Layer map</text><text x="955" y="310" fill="#80506a" font-size="22">mapping + receipt</text><text x="971" y="354" fill="#80506a" font-size="22">not imported</text>
  </g>
  <text x="65" y="520" fill="#26384a" font-family="Segoe UI,Arial" font-size="23">Licensed source reused in place · no large-file duplication</text>
  <text x="65" y="566" fill="#7a4c3c" font-family="Segoe UI,Arial" font-size="21">No workflow result · no portable project · no source-image export</text>
  <text x="65" y="612" fill="#647484" font-family="Segoe UI,Arial" font-size="20">Capture spots are not single cells · matrix value scale remains unknown</text>
</svg>
