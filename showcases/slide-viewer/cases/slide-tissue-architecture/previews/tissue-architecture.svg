<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CMU-1 source, pyramid, and viewer state</title>
  <desc id="desc">The public SVS hash and three pyramid levels were verified; the viewer remained awaiting mount with no navigation or layer action.</desc>
  <rect width="1200" height="675" fill="#f4efe5"/>
  <text x="70" y="82" fill="#8b3d48" font-family="Segoe UI,Arial" font-size="25">SLIDE VIEWER · APERIO SVS</text>
  <text x="70" y="145" fill="#263238" font-family="Segoe UI,Arial" font-size="43" font-weight="700">CMU-1 source and pyramid</text>
  <g font-family="Segoe UI,Arial">
    <rect x="70" y="205" width="590" height="250" rx="16" fill="#fffaf2" stroke="#8b3d48" stroke-width="4"/>
    <text x="100" y="250" fill="#5f2932" font-size="23" font-weight="700">Level 0 · 46,000 × 32,893</text>
    <rect x="730" y="260" width="295" height="125" rx="14" fill="#fffaf2" stroke="#b45360" stroke-width="4"/>
    <text x="760" y="330" fill="#5f2932" font-size="22" font-weight="700">Level 1 · 11,500 × 8,223</text>
    <rect x="1060" y="300" width="90" height="62" rx="10" fill="#fffaf2" stroke="#d88b94" stroke-width="4"/>
    <text x="862" y="430" fill="#5f2932" font-size="21">Level 2 · 2,875 × 2,055</text>
    <text x="100" y="305" fill="#455a64" font-size="21">240 × 240 tiles · RGB · JPEG 2000</text>
    <text x="100" y="350" fill="#455a64" font-size="21">SHA-256 and 132,565,343 bytes verified</text>
    <rect x="70" y="500" width="1060" height="90" rx="15" fill="#efe2d5" stroke="#a16207"/>
    <text x="100" y="555" fill="#713f12" font-size="24" font-weight="700">Viewer: awaiting-viewer · stateRevision null · no fit, pan, zoom, layer, or render evidence</text>
    <text x="70" y="635" fill="#6b4f4f" font-size="20">Verified source geometry · no current tissue pixels · no morphology interpretation</text>
  </g>
</svg>
