name: Validate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ngs-workflows:
    name: Bundled Snakemake workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "snakemake==8.30.0" "jsonschema>=4,<5" "pyyaml>=6,<7"
      - name: Run engineering smoke configurations and verify scientific inputs remain required
        shell: bash
        run: |
          set -euo pipefail
          for workflow in oai_fastq_qc oai_bulk_rnaseq_counts_qc oai_scrnaseq_fastq_to_count; do
            root="workflows/$workflow"
            (cd "$root" && snakemake --snakefile workflow/Snakefile --configfile config/smoke.yaml --cores 1)
            marker="$root/results-smoke/smoke/ENGINEERING_TEST_ONLY.txt"
            test -s "$marker"
            grep -q "ENGINEERING SMOKE TEST ONLY" "$marker"
            if (cd "$root" && snakemake --snakefile workflow/Snakefile --configfile config/config.yaml --dry-run --cores 1) > "$workflow-dry-run.log" 2>&1; then
              echo "$workflow scientific dry-run unexpectedly succeeded without declared inputs" >&2
              exit 1
            fi
            grep -q "MissingInputException" "$workflow-dry-run.log"
            rm -rf "$root/results-smoke" "$root/.snakemake"
          done

  validate:
    name: Node ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global pnpm@10.15.1
      - run: npm run validate
      - name: Preserve capability reports after a failed validation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capability-reports-${{ matrix.os }}
          path: capabilities/evidence/*.vitest.json
          if-no-files-found: warn
          retention-days: 1

  browser:
    name: Browser interaction and layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  dsh-bundle:
    name: DSH 0.1.1-rc.2 bundle
    runs-on: ubuntu-latest
    steps:
      - name: Use a fresh DSH profile
        shell: bash
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-rosalind-profile" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2 pnpm@10.15.1
      - run: test "$(dsh --version)" = "0.1.1-rc.2"
      - run: test "$(pnpm --version)" = "10.15.1"
      - run: npm run pack:bundle
      - name: Select the exact bundle archive for profile evidence and installation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$PWD" -maxdepth 1 -type f -name 'zichenwang114514-dsh-rosalind-*.tgz' -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test -s "$archive"
          sha256sum "$archive"
          echo "DSH_ROSALIND_PROFILE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - run: npm run test:dsh-profile-evidence
      - name: Install bundle into DSH Web profile
        shell: bash
        run: |
          test -n "${DSH_ROSALIND_PROFILE_ARCHIVE:-}"
          test -s "$DSH_ROSALIND_PROFILE_ARCHIVE"
          dsh plugin --profile web add "$DSH_ROSALIND_PROFILE_ARCHIVE"
          dsh --profile web --dump-config > dsh-config.txt
          grep -q "dsh-rosalind" dsh-config.txt
      - name: Start DSH Web and request the packaged page
        shell: bash
        run: |
          dsh web --port 3180 --no-open > dsh-web.log 2>&1 &
          dsh_pid=$!
          trap 'kill "$dsh_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:3180/ > dsh-web.html; then
              ready=1
              break
            fi
            if ! kill -0 "$dsh_pid" 2>/dev/null; then
              cat dsh-web.log
              wait "$dsh_pid"
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat dsh-web.log
            exit 1
          fi
          test -s dsh-web.html
          grep -q '<div id="root"' dsh-web.html
          ! grep -q 'Failed to initialize extension' dsh-web.log
          DSH_PROFILE_URL=http://127.0.0.1:3180 npx playwright test tests/e2e/dsh-profile.spec.ts --project chromium-1440

  dsh-bundle-windows:
    name: DSH 0.1.1-rc.2 bundle on Windows
    runs-on: windows-latest
    steps:
      - name: Use a fresh DSH profile
        shell: pwsh
        run: '"DSH_HOME=$env:RUNNER_TEMP\dsh-rosalind-profile" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2 pnpm@10.15.1
      - shell: pwsh
        run: |
          if ((dsh --version) -ne '0.1.1-rc.2') { throw 'Expected DSH 0.1.1-rc.2.' }
          if ((pnpm --version) -ne '10.15.1') { throw 'Expected pnpm 10.15.1.' }
      - run: npm run pack:bundle
      - name: Select the exact bundle archive for profile evidence and installation
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath $PWD -File -Filter 'zichenwang114514-dsh-rosalind-*.tgz')
          if ($archives.Count -ne 1) { throw "Expected one bundle archive, received $($archives.Count)." }
          $archive = $archives[0]
          if ($archive.Length -le 0) { throw 'The selected bundle archive is empty.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName | Format-List
          "DSH_ROSALIND_PROFILE_ARCHIVE=$($archive.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run test:dsh-profile-evidence
      - name: Install bundle and exercise the packaged page
        shell: pwsh
        run: |
          if (-not $env:DSH_ROSALIND_PROFILE_ARCHIVE -or -not (Test-Path -LiteralPath $env:DSH_ROSALIND_PROFILE_ARCHIVE -PathType Leaf)) { throw 'The selected bundle archive is unavailable.' }
          dsh plugin --profile web add $env:DSH_ROSALIND_PROFILE_ARCHIVE
          dsh --profile web --dump-config | Set-Content -LiteralPath dsh-config.txt
          if (-not (Select-String -LiteralPath dsh-config.txt -Pattern 'dsh-rosalind' -Quiet)) { throw 'The installed DSH profile does not include dsh-rosalind.' }

          $process = Start-Process -FilePath 'dsh.cmd' -ArgumentList @('web', '--port', '3180', '--no-open') -RedirectStandardOutput dsh-web.log -RedirectStandardError dsh-web-error.log -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..120) {
              if ($process.HasExited) {
                Get-Content -LiteralPath dsh-web.log -ErrorAction SilentlyContinue
                Get-Content -LiteralPath dsh-web-error.log -ErrorAction SilentlyContinue
                throw "DSH Web exited with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3180/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'DSH Web did not become ready.' }
            $env:DSH_PROFILE_URL = 'http://127.0.0.1:3180'
            npx playwright test tests/e2e/dsh-profile.spec.ts --project chromium-1440
            if ($LASTEXITCODE -ne 0) { throw 'The packaged DSH profile interaction test failed.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
