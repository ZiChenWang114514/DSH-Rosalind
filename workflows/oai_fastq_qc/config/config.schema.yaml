$schema: "https://json-schema.org/draft/2020-12/schema"
title: oai_fastq_qc configuration
type: object
additionalProperties: false
required:
  - smoke_mode
  - results_dir
  - threads
properties:
  smoke_mode:
    type: boolean
  results_dir:
    type: string
    minLength: 1
  threads:
    type: integer
    minimum: 1
  samples:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    additionalProperties:
      type: object
      additionalProperties: false
      required: [r1, r2]
      properties:
        r1:
          type: string
          minLength: 1
        r2:
          type: string
          minLength: 1
allOf:
  - if:
      properties:
        smoke_mode:
          const: false
    then:
      required: [samples]
